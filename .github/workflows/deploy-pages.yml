name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '!public/api/**'
      - '!public/emojis/**'
      - 'scripts/build-static-search.mjs'
      - 'scripts/emoji-store.mjs'
      - 'scripts/publish-gh-pages.mjs'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      rebuild_emoji_pages:
        description: 'Also rebuild every /emoji/<slug> detail page'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  publish-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout UI source without emoji binaries
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
          sparse-checkout-cone-mode: false

      - name: Verify emoji binaries are not materialized
        shell: bash
        run: |
          set -euo pipefail
          test ! -e public/emojis
          echo "UI deploy is isolated from production emoji binaries."

      - name: Detect whether emoji detail pages changed
        id: emoji_details
        shell: bash
        run: |
          set -euo pipefail
          rebuild=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.rebuild_emoji_pages }}" = "true" ]; then
              rebuild=true
            fi
          else
            before="${{ github.event.before }}"
            zero_sha="0000000000000000000000000000000000000000"
            base=""

            if [ -n "$before" ] && [ "$before" != "$zero_sha" ]; then
              git fetch --no-tags --filter=blob:none --depth=1 origin "$before" || true
              if git cat-file -e "${before}^{commit}" 2>/dev/null; then
                base="$before"
              fi
            fi

            if [ -z "$base" ] && git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              base="HEAD^"
            fi

            if [ -n "$base" ]; then
              changed_files="$(git diff --name-only "$base" HEAD)"
            else
              changed_files="$(git show --pretty='' --name-only HEAD)"
            fi

            printf '%s\n' "$changed_files"
            if grep -Eq '^(src/data/emojis/|src/pages/emoji/|src/components/beui/EmojiDetail\.astro$|scripts/emoji-store\.mjs$)' <<<"$changed_files"; then
              rebuild=true
            fi
          fi

          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          if [ "$rebuild" = "true" ]; then
            echo "Emoji metadata/detail code changed: /emoji detail pages will be rebuilt after the lightweight UI publish."
          else
            echo "No emoji metadata/detail change: preserving the existing /emoji detail tree."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies and hydrate metadata
        run: npm install --no-audit --no-fund

      - name: Restore static search cache
        id: search-cache
        uses: actions/cache/restore@v4
        with:
          path: public/search
          key: static-search-v3-${{ hashFiles('src/data/emojis/*.json', 'scripts/build-static-search.mjs') }}

      - name: Build static search shards from repository data
        if: steps.search-cache.outputs.cache-hit != 'true'
        env:
          STATIC_DATA_SOURCE: local
        run: npm run build:static-data

      - name: Save static search cache
        if: steps.search-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: public/search
          key: static-search-v3-${{ hashFiles('src/data/emojis/*.json', 'scripts/build-static-search.mjs') }}

      - name: Build lightweight Astro UI
        env:
          SKIP_EMOJI_DETAIL_PAGES: '1'
        run: npx astro build

      - name: Validate lightweight production output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/emojis/index.html
          test ! -e dist/emoji

          unexpected_file="$(find dist/emojis -type f ! -path 'dist/emojis/index.html' -print -quit)"
          if [ -n "$unexpected_file" ]; then
            echo "::error title=Unexpected emoji payload in UI build::Found $unexpected_file under dist/emojis. UI deploys may contain only the /emojis route index; binary emoji assets are published separately."
            exit 1
          fi

          touch dist/.nojekyll
          echo "Lightweight UI build size (no binaries, no /emoji detail pages):"
          du -sh dist

      - name: Fetch current gh-pages metadata only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin \
            '+refs/heads/gh-pages:refs/remotes/origin/gh-pages' || true

      - name: Prepare UI-only gh-pages commit
        id: publish_ui
        env:
          DEPLOY_MODE: site
          DIST_DIR: dist
          PUBLISH_BRANCH: gh-pages
          SOURCE_REF: HEAD
        run: node scripts/publish-gh-pages.mjs

      - name: Push UI gh-pages commit
        if: steps.publish_ui.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${{ steps.publish_ui.outputs.commit }}:refs/heads/gh-pages"

      - name: Build emoji detail pages only when their data changed
        if: steps.emoji_details.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          npx astro build
          test -d dist/emoji
          count="$(find dist/emoji -type f -name index.html | wc -l | tr -d ' ')"
          test "$count" -gt 0
          echo "Built $count emoji detail pages because emoji metadata/detail code changed."

      - name: Refresh gh-pages metadata after UI publish
        if: steps.emoji_details.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags --filter=blob:none origin \
            '+refs/heads/gh-pages:refs/remotes/origin/gh-pages'

      - name: Prepare emoji-detail gh-pages commit
        if: steps.emoji_details.outputs.rebuild == 'true'
        id: publish_details
        env:
          DEPLOY_MODE: details
          DIST_DIR: dist
          PUBLISH_BRANCH: gh-pages
          SOURCE_REF: HEAD
        run: node scripts/publish-gh-pages.mjs

      - name: Push emoji-detail gh-pages commit
        if: steps.emoji_details.outputs.rebuild == 'true' && steps.publish_details.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${{ steps.publish_details.outputs.commit }}:refs/heads/gh-pages"

      - name: Check whether branch-based Pages publishing is active
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
          build_type="$(jq -r '.build_type // ""' <<<"$current")"
          source_branch="$(jq -r '.source.branch // ""' <<<"$current")"
          source_path="$(jq -r '.source.path // ""' <<<"$current")"

          active=false
          if [ "$build_type" = "legacy" ] && [ "$source_branch" = "gh-pages" ] && [ "$source_path" = "/" ]; then
            active=true
          fi

          echo "active=$active" >> "$GITHUB_OUTPUT"
          if [ "$active" != "true" ]; then
            echo "::notice title=One-time GitHub Pages setting required::Open Settings → Pages, choose Deploy from a branch, then select gh-pages and /(root)."
          fi

      - name: Request Pages build explicitly
        if: (steps.publish_ui.outputs.changed == 'true' || steps.publish_details.outputs.changed == 'true') && steps.pages.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            set +e
            output="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" 2>&1)"
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "$output"
              exit 0
            fi
            if grep -q 'HTTP 409' <<<"$output"; then
              sleep $((attempt * 8))
              continue
            fi
            echo "$output" >&2
            exit "$status"
          done

          echo "A Pages build is already queued/running."

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Incremental GitHub Pages deploy'
            echo
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- UI commit: \`${{ steps.publish_ui.outputs.commit }}\`"
            echo "- UI changed: \`${{ steps.publish_ui.outputs.changed }}\`"
            echo "- Emoji details rebuilt: \`${{ steps.emoji_details.outputs.rebuild }}\`"
            echo "- Detail commit: \`${{ steps.publish_details.outputs.commit }}\`"
            echo "- Detail changed: \`${{ steps.publish_details.outputs.changed }}\`"
            echo
            echo 'Normal UI changes skip all `/emoji/<slug>` generation and preserve the existing detail tree. Detail pages are rebuilt only when emoji metadata/detail code changes (or when requested manually). `/emojis` binary files remain owned by the dedicated asset workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
