name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '!public/api/**'
      - '!public/emojis/**'
      - 'scripts/build-static-search.mjs'
      - 'scripts/emoji-store.mjs'
      - 'scripts/publish-gh-pages.mjs'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  publish-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout UI source without emoji binaries
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
          sparse-checkout-cone-mode: false

      - name: Verify emoji binaries are not materialized
        shell: bash
        run: |
          set -euo pipefail
          test ! -e public/emojis
          echo "UI deploy is isolated from production emoji binaries."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies and hydrate metadata
        run: npm install --no-audit --no-fund

      - name: Restore static search cache
        id: search-cache
        uses: actions/cache/restore@v4
        with:
          path: public/search
          key: static-search-v3-${{ hashFiles('src/data/emojis/*.json', 'scripts/build-static-search.mjs') }}

      - name: Build static search shards from repository data
        if: steps.search-cache.outputs.cache-hit != 'true'
        env:
          STATIC_DATA_SOURCE: local
        run: npm run build:static-data

      - name: Save static search cache
        if: steps.search-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: public/search
          key: static-search-v3-${{ hashFiles('src/data/emojis/*.json', 'scripts/build-static-search.mjs') }}

      - name: Build Astro UI without emoji binaries
        run: npx astro build

      - name: Validate lightweight production output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test ! -e dist/emojis
          touch dist/.nojekyll
          echo "Production UI build size without /emojis:"
          du -sh dist

      - name: Fetch current gh-pages metadata only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin \
            '+refs/heads/gh-pages:refs/remotes/origin/gh-pages' || true

      - name: Prepare UI-only gh-pages commit
        id: publish
        env:
          DEPLOY_MODE: site
          DIST_DIR: dist
          PUBLISH_BRANCH: gh-pages
          SOURCE_REF: HEAD
        run: node scripts/publish-gh-pages.mjs

      - name: Push gh-pages commit
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${{ steps.publish.outputs.commit }}:refs/heads/gh-pages"

      - name: Check whether branch-based Pages publishing is active
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
          build_type="$(jq -r '.build_type // ""' <<<"$current")"
          source_branch="$(jq -r '.source.branch // ""' <<<"$current")"
          source_path="$(jq -r '.source.path // ""' <<<"$current")"

          active=false
          if [ "$build_type" = "legacy" ] && [ "$source_branch" = "gh-pages" ] && [ "$source_path" = "/" ]; then
            active=true
          fi

          echo "active=$active" >> "$GITHUB_OUTPUT"
          if [ "$active" != "true" ]; then
            echo "::notice title=One-time GitHub Pages setting required::Open Settings → Pages, choose Deploy from a branch, then select gh-pages and /(root)."
          fi

      - name: Request Pages build explicitly
        if: steps.publish.outputs.changed == 'true' && steps.pages.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            set +e
            output="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" 2>&1)"
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "$output"
              exit 0
            fi
            if grep -q 'HTTP 409' <<<"$output"; then
              sleep $((attempt * 8))
              continue
            fi
            echo "$output" >&2
            exit "$status"
          done

          echo "A Pages build is already queued/running."

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## UI-only GitHub Pages deploy'
            echo
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- gh-pages commit: \`${{ steps.publish.outputs.commit }}\`"
            echo "- Preserved emoji tree: \`${{ steps.publish.outputs.emoji_tree }}\`"
            echo "- Changed: \`${{ steps.publish.outputs.changed }}\`"
            echo
            echo 'UI deploys preserve the existing `/emojis` tree on `gh-pages`. Emoji binaries are published only by the dedicated asset workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
