name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '!public/emojis/**'
      - '!public/api/**'
      - 'scripts/build-static-search.mjs'
      - 'scripts/emoji-store.mjs'
      - 'astro.config.mjs'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore static search cache
        id: search-cache
        uses: actions/cache/restore@v4
        with:
          path: public/search
          key: static-search-v2-${{ hashFiles('src/data/emojis/*.json', 'scripts/build-static-search.mjs') }}

      - name: Build static search shards from repository data
        if: steps.search-cache.outputs.cache-hit != 'true'
        env:
          STATIC_DATA_SOURCE: local
        run: npm run build:static-data

      - name: Save static search cache
        if: steps.search-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: public/search
          key: static-search-v2-${{ hashFiles('src/data/emojis/*.json', 'scripts/build-static-search.mjs') }}

      - name: Build static Astro site
        run: npx astro build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
