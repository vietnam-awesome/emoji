name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/data/**'
      - 'public/**'
      - '!public/emojis/**'
      - '!public/api/**'
      - 'scripts/build-static-search.mjs'
      - 'scripts/emoji-store.mjs'
      - 'scripts/verify-build.mjs'
      - 'astro.config.mjs'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EMOJI_ASSET_ORIGIN: https://raw.githubusercontent.com/vietnam-awesome/emoji/data/public
      VERIFY_ASSET_ORIGIN: https://raw.githubusercontent.com/vietnam-awesome/emoji/data/public
    steps:
      - name: Checkout UI source without emoji data
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout catalog metadata from data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: .emoji-data
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /src/data/
          sparse-checkout-cone-mode: false

      - name: Overlay catalog metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/data
          mkdir -p src
          cp -a .emoji-data/src/data src/data
          rm -rf .emoji-data

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Hydrate emoji catalog
        run: npm run emoji-store:hydrate

      - name: Restore static search cache
        id: search-cache
        uses: actions/cache/restore@v4
        with:
          path: public/search
          key: static-search-v5-data-${{ hashFiles('src/data/emojis/*.json', 'scripts/build-static-search.mjs', '.github/workflows/deploy-pages.yml') }}

      - name: Build static search shards from data branch metadata
        if: steps.search-cache.outputs.cache-hit != 'true'
        env:
          STATIC_DATA_SOURCE: local
        run: npm run build:static-data

      - name: Save static search cache
        if: steps.search-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: public/search
          key: static-search-v5-data-${{ hashFiles('src/data/emojis/*.json', 'scripts/build-static-search.mjs', '.github/workflows/deploy-pages.yml') }}

      - name: Build static Astro site
        run: npx astro build

      - name: Verify built links and data-branch asset URLs
        env:
          VERIFY_FAST: '1'
          VERIFY_DETAIL_LIMIT: '300'
        run: npm run check:build

      - name: Verify emoji binaries are absent from Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -d dist/emojis ] && find dist/emojis -type f ! -name index.html -print -quit | grep -q .; then
            echo 'Unexpected emoji binary copied into dist/emojis.' >&2
            exit 1
          fi
          du -sh dist

      - name: Report Pages artifact size
        shell: bash
        run: |
          set -euo pipefail
          bytes="$(du -sb dist | cut -f1)"
          files="$(find dist -type f | wc -l | tr -d ' ')"
          mib="$((bytes / 1024 / 1024))"
          {
            echo "### GitHub Pages artifact"
            echo "- Size: ${mib} MiB (${bytes} bytes)"
            echo "- Files: ${files}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt 1073741824 ]; then
            echo "::warning::Pages output is above GitHub Pages' officially supported 1 GiB site size."
          fi
          if [ "$bytes" -ge 10737418240 ]; then
            echo "::error::Pages output is at or above the 10 GiB deployment limit."
            echo "Largest dist paths:"
            du -h -d 2 dist | sort -h | tail -30
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
