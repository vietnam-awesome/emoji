name: CI

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMOJI_ASSET_ORIGIN: https://raw.githubusercontent.com/vietnam-awesome/emoji/data/public
      VERIFY_ASSET_ORIGIN: https://raw.githubusercontent.com/vietnam-awesome/emoji/data/public
    steps:
      - name: Checkout source without production emoji data
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout catalog metadata from data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: .emoji-data
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /src/data/
          sparse-checkout-cone-mode: false

      - name: Overlay catalog metadata
        run: |
          rm -rf src/data
          mkdir -p src
          cp -a .emoji-data/src/data src/data
          rm -rf .emoji-data

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Hydrate emoji catalog
        run: npm run emoji-store:hydrate

      - name: Run unit tests
        run: npm test

      - name: Verify emoji metadata
        env:
          VERIFY_DATA_SKIP_ASSETS: '1'
        run: npm run check:data

      - name: Validate static search generator
        run: node --check scripts/build-static-search.mjs

      - name: Build representative static site including static search
        env:
          FAST_BUILD: '1'
          FAST_BUILD_DETAIL_LIMIT: '300'
        run: npm run build

      - name: Verify representative build and data-branch asset URLs
        env:
          VERIFY_FAST: '1'
          VERIFY_DETAIL_LIMIT: '300'
        run: npm run check:build
