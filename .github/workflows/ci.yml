name: CI

on:
  pull_request:
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Verify emoji data
        run: npm run check:data

      - name: Validate static search generator
        run: node --check scripts/build-static-search.mjs

      - name: Build representative static site
        env:
          FAST_BUILD: '1'
          FAST_BUILD_DETAIL_LIMIT: '300'
        run: npx astro build

      - name: Verify representative built links
        env:
          VERIFY_FAST: '1'
          VERIFY_DETAIL_LIMIT: '300'
        run: npm run check:build
