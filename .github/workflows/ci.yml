name: CI

on:
  pull_request:
    # Workflow/docs-only changes do not need to rebuild and verify ~198k static pages.
    # If any source/data/runtime file changes in the same PR, CI still runs normally.
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Verify emoji data
        run: npm run check:data

      - name: Build
        run: npm run build

      - name: Verify built links
        run: npm run check:build
