name: Deploy after data merge

on:
  push:
    branches: [data]
    paths:
      - 'src/data/**'
      - 'public/emojis/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-after-data-merge
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

      - name: Dispatch Turso sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run sync-turso.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f dry_run=false \
            -f force=false \
            -f optimize_fts=false
