name: Discords Import Worker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Category to import"
        required: true
        default: "all"
        type: string
      limit:
        description: "Maximum missing emoji to download"
        required: true
        default: "200"
        type: string
      start_batch:
        description: "First batch to collect"
        required: true
        default: "1"
        type: string
      max_pages:
        description: "Number of batches to scan"
        required: true
        default: "25"
        type: string
      concurrency:
        description: "Parallel image downloads (1-8)"
        required: true
        default: "4"
        type: string
      resume:
        description: "Resume from the existing import branch without downloading again"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

env:
  APP_BRANCH: main
  DATA_BRANCH: data

concurrency:
  group: discords-import-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMPORT_TAG: ${{ inputs.tag }}
      IMPORT_LIMIT: ${{ inputs.limit }}
      IMPORT_START_BATCH: ${{ inputs.start_batch }}
      IMPORT_MAX_PAGES: ${{ inputs.max_pages }}
      IMPORT_CONCURRENCY: ${{ inputs.concurrency }}
      RESUME_IMPORT: ${{ inputs.resume }}

    steps:
      - name: Verify worker branch
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            import/discords-*) ;;
            *)
              echo "Refusing to run Discords worker on '$GITHUB_REF_NAME'. Expected import/discords-*." >&2
              exit 1
              ;;
          esac
          echo "Worker branch: $GITHUB_REF_NAME"

      - name: Checkout importer runtime from main
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APP_BRANCH }}
          persist-credentials: false
          path: app
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout import branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          path: data
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /src/data/
            /public/emojis/community/discords/
            /.github/workflows/import-discords-worker.yml
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install application dependencies
        working-directory: app
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        if: inputs.resume != true
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Hydrate catalog
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Import Discords.com emoji categories
        if: inputs.resume != true
        working-directory: data
        run: |
          node ../app/scripts/import-discords.mjs \
            --tag="$IMPORT_TAG" \
            --limit="$IMPORT_LIMIT" \
            --start-batch="$IMPORT_START_BATCH" \
            --max-pages="$IMPORT_MAX_PAGES" \
            --concurrency="$IMPORT_CONCURRENCY" \
            --delay-ms=350

      - name: Shard import checkpoint
        if: inputs.resume != true
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit and push import checkpoint
        id: checkpoint
        if: inputs.resume != true
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/community/discords

          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No Discords.com updates found."
            exit 0
          fi

          git commit -m "chore(data): checkpoint Discords.com import"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Open draft review PR
        if: inputs.resume != true && steps.checkpoint.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$DATA_BRANCH" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            printf -v body 'Discords.com import checkpoint from worker run `%s`.\n\nThe long-running import is already saved on branch `%s`. Validation runs next.' "$GITHUB_RUN_ID" "$GITHUB_REF_NAME"
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DATA_BRANCH" \
              --head "$GITHUB_REF_NAME" \
              --draft \
              --title "Import Discords.com Emojis #${GITHUB_RUN_NUMBER}" \
              --body "$body"
          fi

      - name: Hydrate checkpoint for verification
        if: inputs.resume == true || steps.checkpoint.outputs.created == 'true'
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Verify emoji metadata
        if: inputs.resume == true || steps.checkpoint.outputs.created == 'true'
        working-directory: data
        env:
          VERIFY_DATA_SKIP_ASSETS: '1'
        run: node ../app/scripts/verify-data.mjs

      - name: Shard verified catalog
        if: inputs.resume == true || steps.checkpoint.outputs.created == 'true'
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit verified data
        if: inputs.resume == true || steps.checkpoint.outputs.created == 'true'
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/community/discords
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): finalize verified Discords.com import"
          fi
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Mark PR ready for review
        if: inputs.resume == true || steps.checkpoint.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$DATA_BRANCH" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY" || true
          else
            printf -v body 'Verified Discords.com import from branch `%s`.' "$GITHUB_REF_NAME"
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DATA_BRANCH" \
              --head "$GITHUB_REF_NAME" \
              --title "Import Discords.com Emojis #${GITHUB_RUN_NUMBER}" \
              --body "$body"
          fi
