name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '!public/emojis/**'
      - '!public/api/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'wrangler.jsonc'
  workflow_dispatch:
  schedule:
    # 01:30 UTC = 08:30 Asia/Ho_Chi_Minh, one hour after the scheduled
    # Turso delta sync on the 1st and 15th. This picks up newly imported assets.
    - cron: '30 1 1,15 * *'

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$TURSO_DATABASE_URL" ]] || missing+=(TURSO_DATABASE_URL)
          [[ -n "$TURSO_AUTH_TOKEN" ]] || missing+=(TURSO_AUTH_TOKEN)

          if (( ${#missing[@]} == 0 )); then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare and Turso deployment credentials are configured.'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            printf 'Worker deployment skipped; missing repository secret(s): %s\n' "${missing[*]}"
          fi

      - name: Compute deploy fingerprint
        if: steps.credentials.outputs.configured == 'true'
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          tree_sha() {
            git rev-parse "HEAD:$1" 2>/dev/null || printf 'missing:%s' "$1"
          }
          HASH="$({
            tree_sha src
            tree_sha public/emojis
            tree_sha public/agents.md
            tree_sha public/llms.txt
            tree_sha astro.config.mjs
            tree_sha package.json
            tree_sha wrangler.jsonc
          } | sha256sum | awk '{print $1}')"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Worker deploy fingerprint: $HASH"

      - name: Check previous successful deployment
        if: steps.credentials.outputs.configured == 'true'
        id: deploy_cache
        uses: actions/cache/restore@v4
        with:
          path: .worker-deploy-state
          key: worker-deploy-${{ steps.fingerprint.outputs.hash }}
          lookup-only: true

      - name: Decide whether deployment is needed
        if: steps.credentials.outputs.configured == 'true'
        id: decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CACHE_HIT: ${{ steps.deploy_cache.outputs.cache-hit }}
        run: |
          SHOULD_DEPLOY=true
          if [[ "$EVENT_NAME" == 'schedule' && "$CACHE_HIT" == 'true' ]]; then
            SHOULD_DEPLOY=false
            echo 'No code or asset changes since the last successful deploy; skipping.'
          fi
          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.credentials.outputs.configured == 'true' && steps.decision.outputs.should_deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install runtime dependencies
        if: steps.credentials.outputs.configured == 'true' && steps.decision.outputs.should_deploy == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build Worker
        if: steps.credentials.outputs.configured == 'true' && steps.decision.outputs.should_deploy == 'true'
        run: npm run build

      - name: Deploy Worker
        if: steps.credentials.outputs.configured == 'true' && steps.decision.outputs.should_deploy == 'true'
        run: npx wrangler deploy

      - name: Configure Worker Turso secrets
        if: steps.credentials.outputs.configured == 'true' && steps.decision.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TURSO_DATABASE_URL" | npx wrangler secret put TURSO_DATABASE_URL
          printf '%s' "$TURSO_AUTH_TOKEN" | npx wrangler secret put TURSO_AUTH_TOKEN

      - name: Remember successful deployment
        if: steps.credentials.outputs.configured == 'true' && steps.decision.outputs.should_deploy == 'true' && success()
        shell: bash
        run: |
          mkdir -p .worker-deploy-state
          printf '%s\n' '${{ steps.fingerprint.outputs.hash }}' > .worker-deploy-state/fingerprint

      - name: Cache successful deployment fingerprint
        if: steps.credentials.outputs.configured == 'true' && steps.decision.outputs.should_deploy == 'true' && success() && steps.deploy_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .worker-deploy-state
          key: worker-deploy-${{ steps.fingerprint.outputs.hash }}
