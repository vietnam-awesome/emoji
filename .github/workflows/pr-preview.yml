name: PR Live Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/components/**'
      - 'src/config/**'
      - 'src/layouts/**'
      - 'src/lib/**'
      - 'src/pages/**'
      - 'src/styles/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'scripts/prepare-pr-preview.mjs'
      - 'scripts/prepare-preview-data.mjs'
      - '.github/workflows/pr-preview.yml'
      - 'public/**'
      - '!public/api/**'
      - '!public/emojis/**'
      - '!public/agents.md'
      - '!public/llms.txt'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-live-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_BRANCH: pr-preview-${{ github.event.pull_request.number }}
      PR_PREVIEW_BASE: /${{ github.repository }}/pr-preview-${{ github.event.pull_request.number }}/
      PR_PREVIEW_SITE: https://raw.githack.com/${{ github.repository }}/pr-preview-${{ github.event.pull_request.number }}/
      PREVIEW_URL: https://raw.githack.com/${{ github.repository }}/pr-preview-${{ github.event.pull_request.number }}/index.html
      PR_PREVIEW_ASSET_ORIGIN: https://emoji.eplus.dev

    steps:
      - name: Checkout representative preview source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/*
            !/src/data/emojis/*
            /src/data/emojis/chunk-0001.json
            /src/data/emojis/chunk-0020.json
            /src/data/emojis/chunk-0040.json
            /src/data/emojis/chunk-0060.json
            /src/data/emojis/chunk-0070.json
            /src/data/emojis/chunk-0079.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies without full catalog hydration
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Prepare representative emoji catalog
        env:
          PREVIEW_EMOJI_LIMIT: '600'
        run: node scripts/prepare-preview-data.mjs

      - name: Build lightweight live preview
        env:
          STATIC_DATA_SOURCE: local
          FAST_BUILD: '1'
          FAST_BUILD_DETAIL_LIMIT: '80'
        run: npm run build

      - name: Prepare preview routes
        run: node scripts/prepare-pr-preview.mjs

      - name: Validate preview output
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'ePlus Emoji' dist/index.html
          echo "Representative preview build validated locally."

      - name: Publish preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          preview_dir="$(mktemp -d)"
          cp -a dist/. "$preview_dir/"
          cd "$preview_dir"

          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$PREVIEW_BRANCH"
          git add -A
          git commit -q -m "preview: PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:${PREVIEW_BRANCH}"

      - name: Add live preview to job summary
        run: |
          {
            echo '## 🌐 Live PR preview'
            echo
            echo "[Open the live site]($PREVIEW_URL)"
            echo
            echo 'This preview intentionally uses a representative sample (~600 emoji, ~80 detail pages) and production-hosted emoji assets so UI review stays fast and cheap.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update live preview link on PR
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const marker = '<!-- emoji-live-pr-preview -->';
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n## 🌐 Live Preview\n\n**[Open PR preview →](${process.env.PREVIEW_URL})**\n\nBuilt from commit \`${shortSha}\`. This is an interactive representative build for UI review: about 600 emoji records, about 80 detail pages, with emoji images reused from production instead of rebuilding the full catalog.\n\n> The preview updates automatically when this PR receives a new commit and is not the production site.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
