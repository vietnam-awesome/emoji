name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: ["PR Live Preview"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr-preview-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup-closed-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete all preview branches for closed PR
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const prefix = `pr-preview-${prNumber}-`;
            const legacyName = `pr-preview-${prNumber}`;

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const stale = branches.filter((branch) =>
              branch.name === legacyName || branch.name.startsWith(prefix)
            );

            for (const branch of stale) {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch.name}`
              });
              core.info(`Deleted ${branch.name}`);
            }

            core.summary
              .addHeading('PR preview cleanup')
              .addRaw(`Deleted ${stale.length} preview branch(es) for PR #${prNumber}.`)
              .write();

      - name: Mark preview comment as removed
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- emoji-live-pr-preview -->';
            const prNumber = context.payload.pull_request.number;
            const merged = context.payload.pull_request.merged === true;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (!existing) return;

            const status = merged ? 'merged' : 'closed';
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: `${marker}\n## 🌐 Live Preview\n\nPreview removed because this PR was **${status}**. Its temporary preview branch has been deleted.`
            });

  cleanup-after-redeploy:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep only the current successful preview branch
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            let prNumber = run.pull_requests?.[0]?.number;

            if (!prNumber) {
              const openPulls = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });
              prNumber = openPulls.find((pr) => pr.head.sha === run.head_sha)?.number;
            }

            if (!prNumber) {
              core.notice('No PR could be associated with this preview run; nothing to clean.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            if (pr.state !== 'open') {
              core.notice(`PR #${prNumber} is no longer open; the close cleanup owns final deletion.`);
              return;
            }

            if (pr.head.sha !== run.head_sha) {
              core.notice(`Skipping stale workflow run ${run.id}: PR #${prNumber} has already advanced to ${pr.head.sha}.`);
              return;
            }

            const prefix = `pr-preview-${prNumber}-`;
            const legacyName = `pr-preview-${prNumber}`;
            const keep = `${prefix}${run.head_sha}`;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const stale = branches.filter((branch) =>
              (branch.name === legacyName || branch.name.startsWith(prefix)) && branch.name !== keep
            );

            for (const branch of stale) {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch.name}`
              });
              core.info(`Deleted stale preview ${branch.name}`);
            }

            core.summary
              .addHeading('PR preview redeploy cleanup')
              .addRaw(`Kept \`${keep}\` and deleted ${stale.length} older preview branch(es) for PR #${prNumber}.`)
              .write();

  sweep-stale-previews:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove leaked preview branches
        uses: actions/github-script@v9
        with:
          script: |
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const previewPattern = /^pr-preview-(\d+)(?:-([0-9a-f]{40}))?$/;
            const byPr = new Map();
            for (const branch of branches) {
              const match = branch.name.match(previewPattern);
              if (!match) continue;
              const prNumber = Number(match[1]);
              if (!byPr.has(prNumber)) byPr.set(prNumber, []);
              byPr.get(prNumber).push(branch.name);
            }

            let deleted = 0;
            for (const [prNumber, names] of byPr) {
              let pr = null;
              try {
                ({ data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                }));
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              const keep = pr?.state === 'open'
                ? `pr-preview-${prNumber}-${pr.head.sha}`
                : null;

              for (const name of names) {
                if (keep && name === keep) continue;
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${name}`
                });
                deleted += 1;
                core.info(`Deleted leaked preview ${name}`);
              }
            }

            core.summary
              .addHeading('Stale preview sweep')
              .addRaw(`Deleted ${deleted} leaked preview branch(es) across ${byPr.size} PR(s).`)
              .write();
