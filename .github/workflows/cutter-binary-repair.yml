name: Repair cutter PNG

on:
  push:
    branches:
      - generated/cutter-20260922-1027

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generated/cutter-20260922-1027
          fetch-depth: 0

      - name: Rebuild and validate PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/cutter/sheets
          cat .tmp/cutter-upload-v2/*.b64 | tr -d '\n\r ' | base64 -d > public/cutter/sheets/eplus-originals-20260922-1027.png
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("public/cutter/sheets/eplus-originals-20260922-1027.png")
          b = p.read_bytes()
          expected = "29c1f5c660c2e05e5eafc3456734b688c624490a29cd82dab4cc14ecf7e3fdcc"
          actual = hashlib.sha256(b).hexdigest()
          assert b[:8] == b"\x89PNG\r\n\x1a\n", b[:8]
          assert b[-12:] == b"\x00\x00\x00\x00IEND\xaeB\x60\x82", b[-12:]
          assert len(b) == 38148, len(b)
          assert actual == expected, (actual, expected)
          print(f"PNG OK: {len(b)} bytes sha256={actual}")
          PY

      - name: Clean helper files and commit repaired image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/cutter-upload .tmp/cutter-upload-v2
          rm -f .github/workflows/cutter-binary-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair ePlus Originals cutter PNG"
          git push origin HEAD:generated/cutter-20260922-1027
