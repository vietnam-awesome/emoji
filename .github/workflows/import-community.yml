name: Import Community Emoji

on:
  workflow_dispatch:
    inputs:
      source:
        description: Community source to import
        required: true
        default: all
        type: choice
        options: [all, slackmojis, discadia]
      limit:
        description: Maximum emoji to import per selected source. Slackmojis accepts 0 for all missing records.
        required: true
        default: '200'
        type: string
      slackmojis_mode:
        description: Slackmojis catalog mode
        required: true
        default: recent
        type: choice
        options: [recent, all]
      slackmojis_concurrency:
        description: Parallel Slackmojis image downloads (1-12)
        required: true
        default: '6'
        type: string
  schedule:
    - cron: '30 0 * * 0'

permissions:
  contents: write
  actions: write

concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMPORT_SOURCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source || 'all' }}
      IMPORT_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit || '75' }}
      SLACKMOJIS_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.slackmojis_mode || 'recent' }}
      SLACKMOJIS_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.slackmojis_concurrency || '6' }}

    steps:
      - name: Checkout application code
        uses: actions/checkout@v7
        with:
          ref: main
          path: app
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout writable data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /src/data/
            /public/emojis/community/slackmojis/
            /public/emojis/community/discadia/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install application dependencies
        working-directory: app
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for Discadia
        if: env.IMPORT_SOURCE == 'all' || env.IMPORT_SOURCE == 'discadia'
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Hydrate data-branch catalog
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Import selected community sources
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          if [ "$IMPORT_SOURCE" = "all" ] || [ "$IMPORT_SOURCE" = "slackmojis" ]; then
            node ../app/scripts/import-slackmojis.mjs --mode="$SLACKMOJIS_MODE" --limit="$IMPORT_LIMIT" --concurrency="$SLACKMOJIS_CONCURRENCY"
          fi
          if [ "$IMPORT_SOURCE" = "all" ] || [ "$IMPORT_SOURCE" = "discadia" ]; then
            node ../app/scripts/import-community.mjs --source=discadia --limit="$IMPORT_LIMIT" --concurrency=4
          fi

      - name: Verify emoji index
        working-directory: data
        run: node ../app/scripts/verify-data.mjs

      - name: Shard emoji index for Git
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit imported data
        id: import_commit
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/community/slackmojis public/emojis/community/discadia
          if git diff --cached --quiet; then
            echo "No community emoji updates found."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): import community emoji"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push data branch
        if: steps.import_commit.outputs.created == 'true'
        working-directory: data
        run: |
          set -euo pipefail
          git pull --rebase origin data
          git push origin HEAD:data

      - name: Rebuild UI from updated catalog
        if: steps.import_commit.outputs.created == 'true'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
