name: Import Community Emoji

on:
  workflow_dispatch:
    inputs:
      source:
        description: Community source to import
        required: true
        default: all
        type: choice
        options:
          - all
          - slackmojis
          - discadia
      limit:
        description: Maximum emoji to import per selected source. Slackmojis accepts 0 for all missing records.
        required: true
        default: '200'
        type: string
      slackmojis_mode:
        description: Slackmojis catalog mode. recent sorts newest first; all keeps full catalog order.
        required: true
        default: recent
        type: choice
        options:
          - recent
          - all
      slackmojis_concurrency:
        description: Parallel Slackmojis image downloads (1-12)
        required: true
        default: '6'
        type: string
  schedule:
    # Sunday 01:30 UTC = 08:30 Asia/Ho_Chi_Minh
    - cron: '30 1 * * 0'

permissions:
  contents: write

concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMPORT_SOURCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source || 'all' }}
      IMPORT_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit || '75' }}
      SLACKMOJIS_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.slackmojis_mode || 'recent' }}
      SLACKMOJIS_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.slackmojis_concurrency || '6' }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies and hydrate emoji index
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Discadia
        if: env.IMPORT_SOURCE == 'all' || env.IMPORT_SOURCE == 'discadia'
        run: npx playwright install --with-deps chromium

      - name: Import selected community sources
        run: |
          set -euo pipefail

          if [ "$IMPORT_SOURCE" = "all" ] || [ "$IMPORT_SOURCE" = "slackmojis" ]; then
            echo "Importing Slackmojis (mode=$SLACKMOJIS_MODE, concurrency=$SLACKMOJIS_CONCURRENCY)..."
            node scripts/import-slackmojis.mjs \
              --mode="$SLACKMOJIS_MODE" \
              --limit="$IMPORT_LIMIT" \
              --concurrency="$SLACKMOJIS_CONCURRENCY"
          fi

          if [ "$IMPORT_SOURCE" = "all" ] || [ "$IMPORT_SOURCE" = "discadia" ]; then
            echo "Importing Discadia..."
            node scripts/import-community.mjs \
              --source=discadia \
              --limit="$IMPORT_LIMIT" \
              --concurrency=4
          fi

      - name: Verify emoji index
        run: npm run check:data

      - name: Show import summary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const emojis = JSON.parse(await readFile('src/data/emojis.json', 'utf8'));
          const slackmojis = emojis.filter((item) => item.source === 'slackmojis');
          const discadia = emojis.filter((item) => item.source === 'discadia');
          console.log(`Slackmojis indexed: ${slackmojis.length}`);
          console.log(`Discadia indexed: ${discadia.length}`);
          console.log(`All emoji indexed: ${emojis.length}`);
          NODE

      - name: Shard emoji index for Git
        run: npm run emoji-store:shard

      - name: Commit imported assets and indexes
        id: import_commit
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A src/data/emojis src/data/community-sync-state.json
          if [ -d public/emojis/community/slackmojis ]; then
            git add public/emojis/community/slackmojis
          fi
          if [ -d public/emojis/community/discadia ]; then
            git add public/emojis/community/discadia
          fi

          if git diff --cached --quiet; then
            echo "No community emoji updates found."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: import community emoji"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push imported commit safely
        if: steps.import_commit.outputs.created == 'true'
        run: |
          set -euo pipefail

          rebuild_on_latest_main() {
            echo "main changed during import; rebuilding selected sources on latest main..."
            git reset --hard origin/main
            git clean -fd -- public/emojis/community/slackmojis public/emojis/community/discadia
            rm -f src/data/emojis.json public/api/emojis.json
            npm run emoji-store:hydrate

            if [ "$IMPORT_SOURCE" = "all" ] || [ "$IMPORT_SOURCE" = "slackmojis" ]; then
              node scripts/import-slackmojis.mjs \
                --mode="$SLACKMOJIS_MODE" \
                --limit="$IMPORT_LIMIT" \
                --concurrency="$SLACKMOJIS_CONCURRENCY"
            fi

            if [ "$IMPORT_SOURCE" = "all" ] || [ "$IMPORT_SOURCE" = "discadia" ]; then
              node scripts/import-community.mjs \
                --source=discadia \
                --limit="$IMPORT_LIMIT" \
                --concurrency=4
            fi

            npm run check:data
            npm run emoji-store:shard

            git add -A src/data/emojis src/data/community-sync-state.json
            if [ -d public/emojis/community/slackmojis ]; then
              git add public/emojis/community/slackmojis
            fi
            if [ -d public/emojis/community/discadia ]; then
              git add public/emojis/community/discadia
            fi

            if git diff --cached --quiet; then
              echo "Latest main already contains the requested community updates."
              return 1
            fi

            git commit -m "chore: import community emoji"
            return 0
          }

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            remote_sha="$(git rev-parse origin/main)"
            parent_sha="$(git rev-parse HEAD^)"

            if [ "$parent_sha" != "$remote_sha" ]; then
              if ! rebuild_on_latest_main; then
                exit 0
              fi
            fi

            if git push origin HEAD:main; then
              echo "Community import pushed successfully."
              exit 0
            fi

            echo "main changed while pushing; rebuilding and retrying..."
            sleep $((attempt * 5))
          done

          echo "Push failed after 3 attempts." >&2
          exit 1
