name: Import Community Emoji

on:
  workflow_dispatch:
    inputs:
      source:
        description: Community source to import
        required: true
        default: all
        type: choice
        options: [all, slackmojis, discadia]
      limit:
        description: Maximum emoji to import per selected source. Slackmojis accepts 0 for all missing records.
        required: true
        default: '200'
        type: string
      slackmojis_mode:
        description: Slackmojis catalog mode
        required: true
        default: recent
        type: choice
        options: [recent, all]
      slackmojis_concurrency:
        description: Parallel Slackmojis image downloads (1-12)
        required: true
        default: '6'
        type: string
  schedule:
    - cron: '30 0 * * 0'

permissions:
  contents: write
  pull-requests: write

env:
  APP_BRANCH: main
  DATA_BRANCH: data
  IMPORT_BRANCH_PREFIX: import/community

concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMPORT_SOURCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source || 'all' }}
      IMPORT_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit || '75' }}
      SLACKMOJIS_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.slackmojis_mode || 'recent' }}
      SLACKMOJIS_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.slackmojis_concurrency || '6' }}

    steps:
      - name: Checkout importer runtime from main (read-only)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APP_BRANCH }}
          persist-credentials: false
          path: app
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout data branch for review import
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DATA_BRANCH }}
          persist-credentials: true
          path: data
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /src/data/
            /public/emojis/community/slackmojis/
            /public/emojis/community/discadia/
          sparse-checkout-cone-mode: false

      - name: Verify writable checkout targets data branch
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          branch="$(git branch --show-current)"
          if [ "$branch" != "$DATA_BRANCH" ]; then
            echo "Refusing to write emoji data: checked out '$branch', expected '$DATA_BRANCH'." >&2
            exit 1
          fi
          echo "Writable emoji data branch: $branch"

      - name: Create review branch from data
        id: review_branch
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          import_branch="${IMPORT_BRANCH_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$import_branch"
          echo "name=$import_branch" >> "$GITHUB_OUTPUT"
          echo "Review branch: $import_branch"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install application dependencies
        working-directory: app
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for Discadia
        if: env.IMPORT_SOURCE == 'all' || env.IMPORT_SOURCE == 'discadia'
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Hydrate data-branch catalog
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Import selected community sources
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          if [ "$IMPORT_SOURCE" = "all" ] || [ "$IMPORT_SOURCE" = "slackmojis" ]; then
            node ../app/scripts/import-slackmojis.mjs --mode="$SLACKMOJIS_MODE" --limit="$IMPORT_LIMIT" --concurrency="$SLACKMOJIS_CONCURRENCY"
          fi
          if [ "$IMPORT_SOURCE" = "all" ] || [ "$IMPORT_SOURCE" = "discadia" ]; then
            node ../app/scripts/import-community.mjs --source=discadia --limit="$IMPORT_LIMIT" --concurrency=4
          fi

      - name: Shard import checkpoint
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit and push import checkpoint
        id: checkpoint
        working-directory: data
        env:
          IMPORT_BRANCH: ${{ steps.review_branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/community/slackmojis public/emojis/community/discadia
          if git diff --cached --quiet; then
            echo "No community emoji updates found."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): checkpoint community emoji import"
          git push --set-upstream origin "HEAD:$IMPORT_BRANCH"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Checkpoint pushed before verification."

      - name: Hydrate checkpoint for verification
        if: steps.checkpoint.outputs.created == 'true'
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Verify community metadata and checked-out assets
        if: steps.checkpoint.outputs.created == 'true'
        working-directory: data
        env:
          VERIFY_DATA_ASSET_PREFIXES: '/emojis/community/slackmojis/,/emojis/community/discadia/'
        run: node ../app/scripts/verify-data.mjs

      - name: Shard verified catalog
        if: steps.checkpoint.outputs.created == 'true'
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit verified data
        if: steps.checkpoint.outputs.created == 'true'
        working-directory: data
        env:
          IMPORT_BRANCH: ${{ steps.review_branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/community/slackmojis public/emojis/community/discadia
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): finalize verified community emoji import"
          fi
          git push origin "HEAD:$IMPORT_BRANCH"

      - name: Open review PR
        if: ${{ steps.checkpoint.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORT_BRANCH: ${{ steps.review_branch.outputs.name }}
        shell: bash
        run: |
          set -uo pipefail

          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${DATA_BRANCH}...${IMPORT_BRANCH}?expand=1"
          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DATA_BRANCH" \
            --head "$IMPORT_BRANCH" \
            --state open \
            --json number,url \
            --jq '.[0] | select(.) | "\(.number) \(.url)"' 2>/dev/null || true)"

          if [ -n "$existing" ]; then
            echo "Review PR already exists: $existing"
          else
            printf -v pr_body 'Verified community emoji import from Actions run `%s` on branch `%s`.\n\nThe import checkpoint was pushed before scoped asset verification. A failed PR operation does not invalidate or delete the imported data.' "$GITHUB_RUN_ID" "$IMPORT_BRANCH"

            if gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DATA_BRANCH" \
              --head "$IMPORT_BRANCH" \
              --title "Import Community Emoji #${GITHUB_RUN_NUMBER}" \
              --body "$pr_body"; then
              echo "Review PR created."
            else
              echo "::warning::Automatic PR creation is unavailable. Import and verification already succeeded."
              echo "::warning::Create the PR manually: $compare_url"
            fi
          fi

          exit 0

      - name: Recovery summary
        if: ${{ always() }}
        env:
          IMPORT_BRANCH: ${{ steps.review_branch.outputs.name }}
        shell: bash
        run: |
          {
            echo "### Community import recovery"
            echo "- Import branch: \`${IMPORT_BRANCH:-not-created}\`"
            echo "- Imported data is pushed before pull-request creation."
            echo "- Pull-request creation is best-effort and cannot fail an already verified import."
            if [ -n "${IMPORT_BRANCH:-}" ]; then
              echo "- Manual PR: https://github.com/${GITHUB_REPOSITORY}/compare/${DATA_BRANCH}...${IMPORT_BRANCH}?expand=1"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
