name: Sync Emoji Sources

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to sync
        required: true
        default: all
        type: choice
        options: [all, openmoji, twemoji, noto]
      limit:
        description: Maximum new assets per source. Use 0 for all remaining assets.
        required: true
        default: '250'
        type: string
  schedule:
    - cron: '30 0 * * 0'

permissions:
  contents: write
  actions: write

concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_SOURCE: ${{ github.event.inputs.source || 'all' }}
      SYNC_LIMIT: ${{ github.event.inputs.limit || '250' }}
    steps:
      - name: Checkout application code
        uses: actions/checkout@v7
        with:
          ref: main
          path: app
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout writable data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /src/data/
            /public/emojis/openmoji/
            /public/emojis/twemoji/
            /public/emojis/noto/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install application dependencies
        working-directory: app
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Hydrate data-branch catalog
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Sync licensed emoji assets
        working-directory: data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../app/scripts/sync.mjs --source="$SYNC_SOURCE" --limit="$SYNC_LIMIT"

      - name: Verify index
        working-directory: data
        run: node ../app/scripts/verify-data.mjs

      - name: Shard emoji index for Git
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit data changes
        id: sync_commit
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/openmoji public/emojis/twemoji public/emojis/noto
          if git diff --cached --quiet; then
            echo "No emoji updates found."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): sync emoji sources"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push data branch
        if: steps.sync_commit.outputs.created == 'true'
        working-directory: data
        run: |
          set -euo pipefail
          git pull --rebase origin data
          git push origin HEAD:data

      - name: Rebuild UI from updated catalog
        if: steps.sync_commit.outputs.created == 'true'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
