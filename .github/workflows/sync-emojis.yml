name: Sync Emoji Sources

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to sync
        required: true
        default: all
        type: choice
        options: [all, openmoji, twemoji, noto]
      limit:
        description: Maximum new assets per source. Use 0 for all remaining assets.
        required: true
        default: '250'
        type: string
  schedule:
    - cron: '30 0 * * 0'

permissions:
  contents: write
  pull-requests: write

env:
  APP_BRANCH: main
  DATA_BRANCH: data
  IMPORT_BRANCH_PREFIX: import/licensed

concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_SOURCE: ${{ github.event.inputs.source || 'all' }}
      SYNC_LIMIT: ${{ github.event.inputs.limit || '250' }}
    steps:
      - name: Checkout importer runtime from main (read-only)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APP_BRANCH }}
          persist-credentials: false
          path: app
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout data branch for review import
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DATA_BRANCH }}
          persist-credentials: true
          path: data
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /src/data/
            /public/emojis/openmoji/
            /public/emojis/twemoji/
            /public/emojis/noto/
          sparse-checkout-cone-mode: false

      - name: Verify writable checkout targets data branch
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          branch="$(git branch --show-current)"
          if [ "$branch" != "$DATA_BRANCH" ]; then
            echo "Refusing to write emoji data: checked out '$branch', expected '$DATA_BRANCH'." >&2
            exit 1
          fi
          echo "Writable emoji data branch: $branch"

      - name: Create review branch from data
        id: review_branch
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          import_branch="${IMPORT_BRANCH_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$import_branch"
          echo "name=$import_branch" >> "$GITHUB_OUTPUT"
          echo "Review branch: $import_branch"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install application dependencies
        working-directory: app
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Hydrate data-branch catalog
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Sync licensed emoji assets
        working-directory: data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../app/scripts/sync.mjs --source="$SYNC_SOURCE" --limit="$SYNC_LIMIT"

      - name: Verify licensed metadata and checked-out assets
        working-directory: data
        env:
          VERIFY_DATA_ASSET_PREFIXES: '/emojis/openmoji/,/emojis/twemoji/,/emojis/noto/'
        run: node ../app/scripts/verify-data.mjs

      - name: Shard emoji index for Git
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit data changes
        id: sync_commit
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/openmoji public/emojis/twemoji public/emojis/noto
          if git diff --cached --quiet; then
            echo "No emoji updates found."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): sync emoji sources"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push review branch
        if: steps.sync_commit.outputs.created == 'true'
        working-directory: data
        env:
          IMPORT_BRANCH: ${{ steps.review_branch.outputs.name }}
        run: |
          set -euo pipefail
          git push --set-upstream origin "HEAD:$IMPORT_BRANCH"

      - name: Open review PR
        if: ${{ steps.sync_commit.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORT_BRANCH: ${{ steps.review_branch.outputs.name }}
        shell: bash
        run: |
          set -uo pipefail

          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${DATA_BRANCH}...${IMPORT_BRANCH}?expand=1"
          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DATA_BRANCH" \
            --head "$IMPORT_BRANCH" \
            --state open \
            --json number,url \
            --jq '.[0] | select(.) | "\(.number) \(.url)"' 2>/dev/null || true)"

          if [ -n "$existing" ]; then
            echo "Review PR already exists: $existing"
          else
            printf -v pr_body 'Verified licensed emoji sync from Actions run `%s` on branch `%s`.\n\nThe review branch was pushed before PR creation. A failed PR operation does not invalidate or delete the imported data.' "$GITHUB_RUN_ID" "$IMPORT_BRANCH"

            if gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DATA_BRANCH" \
              --head "$IMPORT_BRANCH" \
              --title "Sync Licensed Emoji Sources #${GITHUB_RUN_NUMBER}" \
              --body "$pr_body"; then
              echo "Review PR created."
            else
              echo "::warning::Automatic PR creation is unavailable. Import and verification already succeeded."
              echo "::warning::Create the PR manually: $compare_url"
            fi
          fi

          exit 0

      - name: Recovery summary
        if: ${{ always() }}
        env:
          IMPORT_BRANCH: ${{ steps.review_branch.outputs.name }}
        shell: bash
        run: |
          {
            echo "### Licensed emoji sync recovery"
            echo "- Import branch: \`${IMPORT_BRANCH:-not-created}\`"
            echo "- Imported data is pushed before pull-request creation."
            echo "- Pull-request creation is best-effort and cannot fail an already verified import."
            if [ -n "${IMPORT_BRANCH:-}" ]; then
              echo "- Manual PR: https://github.com/${GITHUB_REPOSITORY}/compare/${DATA_BRANCH}...${IMPORT_BRANCH}?expand=1"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
