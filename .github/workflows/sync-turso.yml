name: Sync Turso Catalog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare data-branch catalog with Turso without writing anything
        required: false
        default: true
        type: boolean
      force:
        description: Rewrite every catalog row even when content_hash is unchanged (high write usage)
        required: false
        default: false
        type: boolean
      optimize_fts:
        description: Run OPTIMIZE INDEX after sync (normally unnecessary)
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '30 0 1,15 * *'

permissions:
  contents: read

concurrency:
  group: turso-catalog-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TURSO_BATCH_SIZE: '200'

    steps:
      - name: Checkout application code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout catalog metadata from data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: .emoji-data
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /src/data/
          sparse-checkout-cone-mode: false

      - name: Overlay catalog metadata
        run: |
          rm -rf src/data
          mkdir -p src
          cp -a .emoji-data/src/data src/data
          rm -rf .emoji-data

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install database clients
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Turso secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TURSO_DATABASE_URL" || { echo 'TURSO_DATABASE_URL is missing'; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo 'TURSO_AUTH_TOKEN is missing'; exit 1; }
          echo "Turso credentials are configured."

      - name: Sync emoji catalog
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.optimize_fts }}" == "true" ]]; then
            args+=(--optimize-fts)
          fi
          npm run turso:sync -- "${args[@]}"

      - name: Verify Turso catalog
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: npm run turso:verify
