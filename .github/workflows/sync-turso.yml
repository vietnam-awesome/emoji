name: Sync Turso Catalog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare local catalog with Turso without writing anything
        required: false
        default: true
        type: boolean
      force:
        description: Rewrite every catalog row even when content_hash is unchanged (high write usage)
        required: false
        default: false
        type: boolean
      optimize_fts:
        description: Run OPTIMIZE INDEX after sync (normally unnecessary)
        required: false
        default: false
        type: boolean
  # The catalog changes slowly. Two scheduled delta syncs per month are enough and
  # keep Turso Free-plan writes comfortably below the monthly allowance.
  schedule:
    # 00:30 UTC = 07:30 Asia/Ho_Chi_Minh, on the 1st and 15th of each month.
    - cron: '30 0 1,15 * *'

permissions:
  contents: read

concurrency:
  group: turso-catalog-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TURSO_BATCH_SIZE: '200'

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install database clients
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Turso secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TURSO_DATABASE_URL" || { echo 'TURSO_DATABASE_URL is missing'; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo 'TURSO_AUTH_TOKEN is missing'; exit 1; }
          echo "Turso credentials are configured."

      - name: Sync emoji catalog
        shell: bash
        run: |
          set -euo pipefail
          args=()

          # Scheduled runs always perform the safe incremental sync. Manual runs
          # default to dry-run so quota is not consumed accidentally.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.optimize_fts }}" == "true" ]]; then
            args+=(--optimize-fts)
          fi

          npm run turso:sync -- "${args[@]}"

      - name: Verify Turso catalog
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: npm run turso:verify
