name: Fix ePlus emoji crops

on:
  push:
    branches:
      - eplus-originals-assets
    paths:
      - .github/workflows/fix-eplus-crops.yml

permissions:
  contents: write

jobs:
  fix-crops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: eplus-originals-assets
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Clean and recenter all ePlus WebP assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import deque
          from PIL import Image, ImageFilter
          import math

          root = Path("public/emojis/eplus")
          files = sorted(root.glob("*.webp"))
          if len(files) != 100:
              raise SystemExit(f"Expected 100 WebP files, found {len(files)}")

          def components(mask, w, h):
              seen = bytearray(w*h)
              out = []
              for y in range(h):
                  for x in range(w):
                      pos = y*w+x
                      if seen[pos] or not mask[pos]:
                          continue
                      q = deque([(x,y)])
                      seen[pos] = 1
                      pts = []
                      minx=miny=10**9
                      maxx=maxy=-1
                      sx=sy=0
                      while q:
                          cx,cy=q.popleft()
                          pts.append((cx,cy))
                          sx += cx; sy += cy
                          minx=min(minx,cx); maxx=max(maxx,cx)
                          miny=min(miny,cy); maxy=max(maxy,cy)
                          for ny in range(max(0,cy-1), min(h,cy+2)):
                              for nx in range(max(0,cx-1), min(w,cx+2)):
                                  np = ny*w+nx
                                  if not seen[np] and mask[np]:
                                      seen[np]=1
                                      q.append((nx,ny))
                      area=len(pts)
                      out.append({
                          "pts": pts, "area": area,
                          "bbox": (minx,miny,maxx,maxy),
                          "cx": sx/area, "cy": sy/area
                      })
              return out

          for p in files:
              im = Image.open(p).convert("RGBA")
              w,h = im.size
              if (w,h) != (128,128):
                  im = im.resize((128,128), Image.Resampling.LANCZOS)
                  w=h=128

              a = im.getchannel("A")
              av = list(a.getdata())
              binary = bytearray(1 if v > 10 else 0 for v in av)
              comps = components(binary,w,h)
              comps = [c for c in comps if c["area"] >= 4]
              if not comps:
                  raise RuntimeError(f"No visible component in {p.name}")

              main = max(comps,key=lambda c:c["area"])
              keep = []
              for c in comps:
                  if c is main:
                      keep.append(c); continue
                  minx,miny,maxx,maxy = c["bbox"]
                  touches_edge = minx <= 2 or miny <= 2 or maxx >= w-3 or maxy >= h-3
                  dist = math.hypot(c["cx"]-main["cx"], c["cy"]-main["cy"])
                  # Neighbor slivers from bad grid cuts almost always touch an edge.
                  if touches_edge and c["area"] < main["area"]*0.30:
                      continue
                  # Preserve nearby hearts, stars, droplets, confetti and props.
                  if c["area"] >= 8 and dist <= 68:
                      keep.append(c)

              km = Image.new("L",(w,h),0)
              kp = km.load()
              for c in keep:
                  for x,y in c["pts"]:
                      kp[x,y]=255
              # Expand back into original antialiasing/glow pixels.
              km = km.filter(ImageFilter.MaxFilter(5))
              orig = im.getchannel("A")
              newa = Image.new("L",(w,h),0)
              oa=list(orig.getdata()); ma=list(km.getdata())
              newa.putdata([oa[i] if ma[i] else 0 for i in range(w*h)])
              im.putalpha(newa)

              bbox = newa.point(lambda v: 255 if v > 3 else 0).getbbox()
              if not bbox:
                  raise RuntimeError(f"Empty output for {p.name}")
              crop = im.crop(bbox)

              inner = 116
              scale = min(inner/crop.width, inner/crop.height)
              nw=max(1,round(crop.width*scale)); nh=max(1,round(crop.height*scale))
              crop = crop.resize((nw,nh), Image.Resampling.LANCZOS)

              canvas = Image.new("RGBA",(128,128),(0,0,0,0))
              canvas.alpha_composite(crop,((128-nw)//2,(128-nh)//2))
              canvas.save(p,"WEBP",lossless=True,method=6)

          print(f"Fixed {len(files)} WebP files")
          PY

      - name: Verify images
        shell: bash
        run: |
          set -euo pipefail
          count="$(find public/emojis/eplus -maxdepth 1 -type f -name '*.webp' | wc -l)"
          test "$count" -eq 100
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in Path("public/emojis/eplus").glob("*.webp"):
              with Image.open(p) as im:
                  im.load()
                  assert im.size == (128,128), (p, im.size)
                  assert im.mode in ("RGBA","RGB"), (p,im.mode)
          print("Verified 100/100 images")
          PY

      - name: Commit corrected crops
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-eplus-crops.yml
          git add -A public/emojis/eplus .github/workflows/fix-eplus-crops.yml
          git commit -m "fix(data): clean and recenter ePlus emoji crops"
          git push origin HEAD:eplus-originals-assets
