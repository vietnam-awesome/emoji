name: Import ePlus Originals

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  APP_BRANCH: main
  DATA_BRANCH: data
  IMPORT_BRANCH_PREFIX: import/eplus

concurrency:
  group: emoji-data-import-eplus
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout importer runtime from main (read-only)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APP_BRANCH }}
          persist-credentials: false
          path: app
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout data branch for review import
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DATA_BRANCH }}
          persist-credentials: true
          path: data
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /src/data/
            /public/emojis/eplus/
          sparse-checkout-cone-mode: false

      - name: Create review branch from data
        id: review_branch
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          base_branch="$(git branch --show-current)"
          if [ "$base_branch" != "$DATA_BRANCH" ]; then
            echo "Refusing to import: checked out '$base_branch', expected '$DATA_BRANCH'." >&2
            exit 1
          fi
          import_branch="${IMPORT_BRANCH_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$import_branch"
          echo "name=$import_branch" >> "$GITHUB_OUTPUT"
          echo "Review branch: $import_branch"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Hydrate data-branch catalog
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Import ePlus original assets
        working-directory: data
        run: node ../app/scripts/import-eplus.mjs

      - name: Verify catalog metadata
        working-directory: data
        env:
          VERIFY_DATA_SKIP_ASSETS: '1'
        run: node ../app/scripts/verify-data.mjs

      - name: Shard emoji catalog for Git
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit import candidate
        id: import_commit
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/eplus
          if git diff --cached --quiet; then
            echo "No ePlus original emoji updates found."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat(data): import ePlus original emoji for review"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push review branch
        if: steps.import_commit.outputs.created == 'true'
        working-directory: data
        env:
          IMPORT_BRANCH: ${{ steps.review_branch.outputs.name }}
        run: |
          set -euo pipefail
          git push --set-upstream origin "HEAD:$IMPORT_BRANCH"

      - name: Open review pull request
        if: steps.import_commit.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORT_BRANCH: ${{ steps.review_branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          printf -v pr_body 'Automated ePlus import candidate from Actions run `%s`.\n\nReview the assets and catalog diff. Merge this PR into `data` only after approval. Production deployment starts automatically after the merge.' "$GITHUB_RUN_ID"
          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DATA_BRANCH" \
            --head "$IMPORT_BRANCH" \
            --title "Import ePlus Originals #${GITHUB_RUN_NUMBER}" \
            --body "$pr_body")"
          echo "Review PR: $pr_url"
