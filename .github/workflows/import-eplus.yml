name: Import ePlus Originals

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Rebuild emoji.eplus.dev after catalog update
        required: false
        default: true
        type: boolean
      sync_turso:
        description: Sync updated catalog to Turso after import
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

env:
  APP_BRANCH: main
  DATA_BRANCH: data

concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout importer runtime from main (read-only)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APP_BRANCH }}
          persist-credentials: false
          path: app
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout writable emoji data branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DATA_BRANCH }}
          persist-credentials: true
          path: data
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /src/data/
            /public/emojis/eplus/
          sparse-checkout-cone-mode: false

      - name: Verify writable checkout targets data branch
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          branch="$(git branch --show-current)"
          if [ "$branch" != "$DATA_BRANCH" ]; then
            echo "Refusing to write emoji data: checked out '$branch', expected '$DATA_BRANCH'." >&2
            exit 1
          fi
          echo "Writable emoji data branch: $branch"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Hydrate data-branch catalog
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Import ePlus original assets
        working-directory: data
        run: node ../app/scripts/import-eplus.mjs

      - name: Verify catalog metadata
        working-directory: data
        env:
          VERIFY_DATA_SKIP_ASSETS: '1'
        run: node ../app/scripts/verify-data.mjs

      - name: Shard emoji catalog for Git
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit ePlus original catalog
        id: import_commit
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/eplus
          if git diff --cached --quiet; then
            echo "No ePlus original emoji updates found."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat(data): sync ePlus original emoji"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push data branch
        if: steps.import_commit.outputs.created == 'true'
        working-directory: data
        run: |
          set -euo pipefail
          git pull --rebase origin "$DATA_BRANCH"
          git push origin "HEAD:$DATA_BRANCH"

      - name: Rebuild production site
        if: steps.import_commit.outputs.created == 'true' && inputs.deploy_pages == true
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "$APP_BRANCH"

      - name: Sync Turso catalog
        if: steps.import_commit.outputs.created == 'true' && inputs.sync_turso == true
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-turso.yml --ref "$APP_BRANCH" -f dry_run=false -f force=false -f optimize_fts=false
