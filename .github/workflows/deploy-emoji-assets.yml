name: Deploy Emoji Assets

on:
  push:
    branches: [main]
    paths:
      - 'public/emojis/**'
      - '.github/workflows/deploy-emoji-assets.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  publish-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository metadata without emoji binaries
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
          sparse-checkout-cone-mode: false

      - name: Verify source emoji tree without materializing binaries
        shell: bash
        run: |
          set -euo pipefail
          emoji_tree="$(git rev-parse HEAD:public/emojis)"
          test -n "$emoji_tree"
          test ! -e public/emojis
          echo "Emoji source tree: $emoji_tree"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch current gh-pages metadata only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin \
            '+refs/heads/gh-pages:refs/remotes/origin/gh-pages'

      - name: Prepare asset-only gh-pages commit
        id: publish
        env:
          DEPLOY_MODE: assets
          PUBLISH_BRANCH: gh-pages
          SOURCE_REF: HEAD
        run: node scripts/publish-gh-pages.mjs

      - name: Push gh-pages commit
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${{ steps.publish.outputs.commit }}:refs/heads/gh-pages"

      - name: Check whether branch-based Pages publishing is active
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
          build_type="$(jq -r '.build_type // ""' <<<"$current")"
          source_branch="$(jq -r '.source.branch // ""' <<<"$current")"
          source_path="$(jq -r '.source.path // ""' <<<"$current")"

          active=false
          if [ "$build_type" = "legacy" ] && [ "$source_branch" = "gh-pages" ] && [ "$source_path" = "/" ]; then
            active=true
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Request Pages build explicitly
        if: steps.publish.outputs.changed == 'true' && steps.pages.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            set +e
            output="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" 2>&1)"
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              echo "$output"
              exit 0
            fi
            if grep -q 'HTTP 409' <<<"$output"; then
              sleep $((attempt * 8))
              continue
            fi
            echo "$output" >&2
            exit "$status"
          done

          echo "A Pages build is already queued/running."

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Emoji asset-only deploy'
            echo
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- gh-pages commit: \`${{ steps.publish.outputs.commit }}\`"
            echo "- Emoji tree: \`${{ steps.publish.outputs.emoji_tree }}\`"
            echo "- Changed: \`${{ steps.publish.outputs.changed }}\`"
            echo
            echo 'This workflow updates only `/emojis` on `gh-pages`; it does not rebuild Astro/UI.'
          } >> "$GITHUB_STEP_SUMMARY"
