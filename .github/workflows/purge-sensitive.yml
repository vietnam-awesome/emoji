name: Purge Sensitive Emoji

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/content-safety.mjs'
      - 'scripts/emoji-store.mjs'
      - '.github/workflows/purge-sensitive.yml'

permissions:
  contents: write

concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies and sanitize hydrated catalog
        run: npm install --no-audit --no-fund

      - name: Persist sanitized shards
        run: npm run emoji-store:shard

      - name: Commit purged records and assets
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A src/data/emojis public/emojis/community
          if git diff --cached --quiet; then
            echo "No sensitive catalog records remain to purge."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: purge sensitive emoji records"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push cleanup safely
        if: steps.cleanup.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Could not rebase cleanup onto latest main." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Sensitive catalog cleanup pushed successfully."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Cleanup push failed after 3 attempts." >&2
          exit 1

      - name: Note Turso sync policy
        run: |
          echo "Catalog cleanup is persisted in Git."
          echo "Turso is intentionally not synced here to protect the Free-plan write quota."
          echo "The next scheduled sync runs on the 1st or 15th, or use the Sync Turso Catalog workflow manually."
