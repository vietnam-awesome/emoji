name: Import Discords.com Emojis

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Category to import. Use all to auto-discover every safe Discords category; home/trending is also supported."
        required: true
        default: "all"
        type: string
      limit:
        description: "Maximum missing emoji to download. Use 0 for all discovered emoji in the selected batch range."
        required: true
        default: "200"
        type: string
      start_batch:
        description: "First Load more batch to collect. Use 1 from the beginning, or 101 after finishing batches 1-100."
        required: true
        default: "1"
        type: string
      max_pages:
        description: "Number of batches to scan starting at Start batch."
        required: true
        default: "25"
        type: string
      concurrency:
        description: "Parallel image downloads (1-8)"
        required: true
        default: "4"
        type: string
  schedule:
    - cron: "30 0 * * 0"

permissions:
  contents: write
  actions: write

env:
  APP_BRANCH: main
  DATA_BRANCH: data

concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMPORT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || 'all' }}
      IMPORT_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit || '75' }}
      IMPORT_START_BATCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.start_batch || '1' }}
      IMPORT_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_pages || '25' }}
      IMPORT_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.concurrency || '4' }}

    steps:
      - name: Checkout importer runtime from main (read-only)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APP_BRANCH }}
          persist-credentials: false
          path: app
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout writable emoji data branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DATA_BRANCH }}
          persist-credentials: true
          path: data
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /src/data/
            /public/emojis/community/discords/
          sparse-checkout-cone-mode: false

      - name: Verify writable checkout targets data branch
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          branch="$(git branch --show-current)"
          if [ "$branch" != "$DATA_BRANCH" ]; then
            echo "Refusing to write emoji data: checked out '$branch', expected '$DATA_BRANCH'." >&2
            exit 1
          fi
          echo "Writable emoji data branch: $branch"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install application dependencies
        working-directory: app
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Hydrate data-branch catalog
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Import Discords.com emoji categories
        working-directory: data
        run: |
          node ../app/scripts/import-discords.mjs \
            --tag="$IMPORT_TAG" \
            --limit="$IMPORT_LIMIT" \
            --start-batch="$IMPORT_START_BATCH" \
            --max-pages="$IMPORT_MAX_PAGES" \
            --concurrency="$IMPORT_CONCURRENCY" \
            --delay-ms=350

      - name: Verify emoji index
        working-directory: data
        run: node ../app/scripts/verify-data.mjs

      - name: Shard emoji index for Git
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit imported data
        id: import_commit
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/community/discords
          if git diff --cached --quiet; then
            echo "No Discords.com updates found."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): import Discords.com emojis"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push data branch
        if: steps.import_commit.outputs.created == 'true'
        working-directory: data
        run: |
          set -euo pipefail
          git pull --rebase origin "$DATA_BRANCH"
          git push origin "HEAD:$DATA_BRANCH"

      - name: Rebuild UI from updated catalog
        if: steps.import_commit.outputs.created == 'true'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "$APP_BRANCH"
