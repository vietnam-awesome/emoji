name: Import Discords.com Emojis

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Category to import. Use all to auto-discover every safe Discords category; home/trending is also supported."
        required: true
        default: "all"
        type: string
      limit:
        description: "Maximum missing emoji to download. Use 0 for all discovered emoji in the selected batch range."
        required: true
        default: "200"
        type: string
      start_batch:
        description: "First Load more batch to collect. Use 1 from the beginning, or 101 after finishing batches 1-100."
        required: true
        default: "1"
        type: string
      max_pages:
        description: "Number of batches to scan starting at Start batch. Example: start 101 + 100 scans batches 101-200."
        required: true
        default: "25"
        type: string
      concurrency:
        description: "Parallel image downloads (1-8)"
        required: true
        default: "4"
        type: string
  schedule:
    # Daily at 12:17 Asia/Ho_Chi_Minh (05:17 UTC).
    # Auto-discover all safe Discords categories and scan from batch 1.
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMPORT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || 'all' }}
      IMPORT_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit || '75' }}
      IMPORT_START_BATCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.start_batch || '1' }}
      IMPORT_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_pages || '25' }}
      IMPORT_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.concurrency || '4' }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Import Discords.com emoji categories
        run: |
          echo "Category: $IMPORT_TAG"
          echo "Download limit: $IMPORT_LIMIT"
          echo "Start batch: $IMPORT_START_BATCH"
          echo "Batches to scan: $IMPORT_MAX_PAGES"
          echo "Concurrency: $IMPORT_CONCURRENCY"
          echo "18+ filter: enabled"

          node scripts/import-discords.mjs \
            --tag="$IMPORT_TAG" \
            --limit="$IMPORT_LIMIT" \
            --start-batch="$IMPORT_START_BATCH" \
            --max-pages="$IMPORT_MAX_PAGES" \
            --concurrency="$IMPORT_CONCURRENCY" \
            --delay-ms=350

      - name: Verify emoji index
        run: npm run check:data

      - name: Show import summary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const emojis = JSON.parse(await readFile('src/data/emojis.json', 'utf8'));
          const state = JSON.parse(await readFile('src/data/community-sync-state.json', 'utf8'));
          const discords = emojis.filter((item) => item.source === 'discords');
          const categories = Object.keys(state.discords?.categories || {});
          console.log(`Discords.com categories scanned: ${categories.length}`);
          console.log(`Batch range: ${state.discords?.startBatch || 1}-${state.discords?.endBatch || '?'}`);
          console.log(`Discords.com discovered this run: ${state.discords?.discovered || 0}`);
          console.log(`18+ emoji filtered this run: ${state.discords?.adultFilteredThisRun || 0}`);
          console.log(`Existing 18+ records purged: ${state.discords?.purgedAdultRecords || 0}`);
          console.log(`Discords.com indexed: ${discords.length}`);
          console.log(`All emoji indexed: ${emojis.length}`);
          NODE

      - name: Commit imported assets and indexes
        id: import_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/api/emojis.json src/data/emojis.json src/data/community-sync-state.json
          if [ -d public/emojis/community/discords ]; then
            git add public/emojis/community/discords
          fi

          if git diff --cached --quiet; then
            echo "No Discords.com updates found."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: import Discords.com emojis"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push imported commit safely
        if: steps.import_commit.outputs.created == 'true'
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Could not rebase import commit onto latest main." >&2
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Import pushed successfully."
              exit 0
            fi

            echo "main changed while pushing; retrying..."
            sleep $((attempt * 5))
          done

          echo "Push failed after 3 attempts." >&2
          exit 1
