name: Import Discords.com Emojis

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Category to import. Use all to auto-discover every safe Discords category."
        required: true
        default: "all"
        type: string
      limit:
        description: "Maximum missing emoji to download. Use 0 for all discovered emoji."
        required: true
        default: "200"
        type: string
      start_batch:
        description: "First Load more batch to collect."
        required: true
        default: "1"
        type: string
      max_pages:
        description: "Number of batches to scan."
        required: true
        default: "25"
        type: string
      concurrency:
        description: "Parallel image downloads (1-8)"
        required: true
        default: "4"
        type: string
      resume_branch:
        description: "Optional existing import/discords-* branch to resume without downloading again."
        required: false
        default: ""
        type: string
  schedule:
    - cron: "30 0 * * 0"

permissions:
  contents: write
  actions: write

env:
  DATA_BRANCH: data
  IMPORT_BRANCH_PREFIX: import/discords
  WORKER_WORKFLOW: import-discords-worker.yml

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IMPORT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || 'all' }}
      IMPORT_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit || '75' }}
      IMPORT_START_BATCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.start_batch || '1' }}
      IMPORT_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_pages || '25' }}
      IMPORT_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.concurrency || '4' }}
      RESUME_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.resume_branch || '' }}

    steps:
      - name: Create or select import branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$RESUME_BRANCH" ]; then
            case "$RESUME_BRANCH" in
              import/discords-*) ;;
              *)
                echo "Invalid resume branch: $RESUME_BRANCH" >&2
                exit 1
                ;;
            esac

            gh api "repos/$GITHUB_REPOSITORY/branches/$RESUME_BRANCH" >/dev/null
            import_branch="$RESUME_BRANCH"
            resume=true
          else
            data_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DATA_BRANCH" --jq '.object.sha')"
            import_branch="${IMPORT_BRANCH_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$import_branch" \
              -f sha="$data_sha" >/dev/null
            resume=false
          fi

          echo "name=$import_branch" >> "$GITHUB_OUTPUT"
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
          echo "Import branch: $import_branch"

      - name: Dispatch worker on import branch
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORT_BRANCH: ${{ steps.branch.outputs.name }}
          RESUME: ${{ steps.branch.outputs.resume }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run "$WORKER_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$IMPORT_BRANCH" \
            -f tag="$IMPORT_TAG" \
            -f limit="$IMPORT_LIMIT" \
            -f start_batch="$IMPORT_START_BATCH" \
            -f max_pages="$IMPORT_MAX_PAGES" \
            -f concurrency="$IMPORT_CONCURRENCY" \
            -f resume="$RESUME"

          echo "Worker dispatched on branch: $IMPORT_BRANCH"
