name: Import Emoji.gg Catalog

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Category to import: all, pepe, anime, gaming, category ID, or comma-separated values"
        required: true
        default: "all"
        type: string
      limit_per_category:
        description: "Maximum missing emoji to import per category. Use 0 only for an intentional full manual import."
        required: true
        default: "250"
        type: string
      max_pages_per_category:
        description: "Safety cap for category pagination"
        required: true
        default: "1500"
        type: string
  schedule:
    - cron: "30 0 * * 0"

permissions:
  contents: write
  actions: write

concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IMPORT_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.category || 'all' }}
      IMPORT_LIMIT_PER_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit_per_category || '75' }}
      IMPORT_MAX_PAGES_PER_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_pages_per_category || '750' }}

    steps:
      - name: Checkout application code
        uses: actions/checkout@v7
        with:
          ref: main
          path: app
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout writable data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /src/data/
            /public/emojis/community/emojigg/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install application dependencies
        working-directory: app
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Hydrate data-branch catalog
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Import Emoji.gg catalog
        working-directory: data
        run: |
          node ../app/scripts/import-emojigg.mjs \
            --category="$IMPORT_CATEGORY" \
            --limit-per-category="$IMPORT_LIMIT_PER_CATEGORY" \
            --max-pages-per-category="$IMPORT_MAX_PAGES_PER_CATEGORY" \
            --empty-page-stop=3 \
            --concurrency=8

      - name: Verify emoji index
        working-directory: data
        run: node ../app/scripts/verify-data.mjs

      - name: Shard emoji index for Git
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit imported data
        id: import_commit
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/community/emojigg
          if git diff --cached --quiet; then
            echo "No Emoji.gg updates found."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): import Emoji.gg catalog"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push data branch
        if: steps.import_commit.outputs.created == 'true'
        working-directory: data
        run: |
          set -euo pipefail
          git pull --rebase origin data
          git push origin HEAD:data

      - name: Rebuild UI from updated catalog
        if: steps.import_commit.outputs.created == 'true'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
