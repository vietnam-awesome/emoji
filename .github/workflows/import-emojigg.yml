name: Import Emoji.gg Catalog

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Category to import: all, pepe, anime, gaming, category ID, or comma-separated values"
        required: true
        default: "all"
        type: string
      limit_per_category:
        description: "Maximum missing emoji to import per category. Use 0 only for an intentional full manual import."
        required: true
        default: "250"
        type: string
      max_pages_per_category:
        description: "Safety cap for category pagination"
        required: true
        default: "1500"
        type: string
  schedule:
    - cron: "30 0 * * 0"

permissions:
  contents: write
  pull-requests: write

env:
  APP_BRANCH: main
  DATA_BRANCH: data
  IMPORT_BRANCH_PREFIX: import/emojigg

concurrency:
  group: emoji-data-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IMPORT_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.category || 'all' }}
      IMPORT_LIMIT_PER_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit_per_category || '75' }}
      IMPORT_MAX_PAGES_PER_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_pages_per_category || '750' }}

    steps:
      - name: Checkout importer runtime from main (read-only)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APP_BRANCH }}
          persist-credentials: false
          path: app
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/public/emojis/
            !/src/data/
          sparse-checkout-cone-mode: false

      - name: Checkout data branch for review import
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DATA_BRANCH }}
          persist-credentials: true
          path: data
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /src/data/
            /public/emojis/community/emojigg/
          sparse-checkout-cone-mode: false

      - name: Verify writable checkout targets data branch
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          branch="$(git branch --show-current)"
          if [ "$branch" != "$DATA_BRANCH" ]; then
            echo "Refusing to write emoji data: checked out '$branch', expected '$DATA_BRANCH'." >&2
            exit 1
          fi
          echo "Writable emoji data branch: $branch"

      - name: Create review branch from data
        id: review_branch
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          import_branch="${IMPORT_BRANCH_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$import_branch"
          echo "name=$import_branch" >> "$GITHUB_OUTPUT"
          echo "Review branch: $import_branch"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install application dependencies
        working-directory: app
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Hydrate data-branch catalog
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Import Emoji.gg catalog
        working-directory: data
        run: |
          node ../app/scripts/import-emojigg.mjs \
            --category="$IMPORT_CATEGORY" \
            --limit-per-category="$IMPORT_LIMIT_PER_CATEGORY" \
            --max-pages-per-category="$IMPORT_MAX_PAGES_PER_CATEGORY" \
            --empty-page-stop=3 \
            --concurrency=8

      - name: Shard import checkpoint
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit and push import checkpoint
        id: checkpoint
        working-directory: data
        env:
          IMPORT_BRANCH: ${{ steps.review_branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/community/emojigg

          if git diff --cached --quiet; then
            echo "No Emoji.gg updates found."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(data): checkpoint Emoji.gg import"
          git push --set-upstream origin "HEAD:$IMPORT_BRANCH"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Checkpoint pushed before verification."

      - name: Hydrate checkpoint for verification
        if: steps.checkpoint.outputs.created == 'true'
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs hydrate

      - name: Verify emoji metadata
        if: steps.checkpoint.outputs.created == 'true'
        working-directory: data
        env:
          VERIFY_DATA_SKIP_ASSETS: '1'
        run: node ../app/scripts/verify-data.mjs

      - name: Shard verified catalog
        if: steps.checkpoint.outputs.created == 'true'
        working-directory: data
        run: node ../app/scripts/emoji-store.mjs shard

      - name: Commit verified data
        if: steps.checkpoint.outputs.created == 'true'
        working-directory: data
        env:
          IMPORT_BRANCH: ${{ steps.review_branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data public/emojis/community/emojigg
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): finalize verified Emoji.gg import"
          fi
          git push origin "HEAD:$IMPORT_BRANCH"

      - name: Open review pull request
        if: steps.checkpoint.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORT_BRANCH: ${{ steps.review_branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          printf -v pr_body 'Automated Emoji.gg import candidate from Actions run `%s`.\n\nThe import checkpoint was pushed before metadata verification, so a later verification failure does not discard the downloaded assets. Review the assets and catalog diff. Merge this PR into `data` only after approval. Production deployment starts automatically after the merge.' "$GITHUB_RUN_ID"
          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DATA_BRANCH" \
            --head "$IMPORT_BRANCH" \
            --title "Import Emoji.gg Catalog #${GITHUB_RUN_NUMBER}" \
            --body "$pr_body")"
          echo "Review PR: $pr_url"
